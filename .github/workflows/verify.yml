name: Verification

# Two signals per pull request:
#   1. unit — the contract invariants (fast, no browser)
#   2. meerkat-ingest — the TestSprite wave, posted into Meerkat's ledger
#
# TestSprite itself is wired through its GitHub App, so there is no workflow step
# for it: the `TestSprite V3` check is posted by the App and required by branch
# protection on `main`.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  meerkat-ingest:
    name: meerkat-ingest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install the TestSprite CLI (read-only use)
        run: npm install -g @testsprite/testsprite-cli@0.14.0 --silent

      - name: Configure CLI credentials
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: testsprite setup --from-env --no-agent -y

      # The App run starts when the deployment is ready. Waiting here keeps the
      # ingest honest: it posts the wave that actually ran on this commit.
      - name: Wait for the App run to settle
        run: sleep 240

      - name: Ingest the wave into Meerkat
        env:
          TESTSPRITE_PROJECT_ID: ${{ vars.TESTSPRITE_PROJECT_ID }}
          MEERKAT_API_KEY: ${{ secrets.MEERKAT_API_KEY }}
          MEERKAT_PROJECT_SLUG: split-bill
          MEERKAT_API_URL: https://meerkat-app.vercel.app
        run: |
          node scripts/ingest-latest.mjs \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --branch "${{ github.event.pull_request.head.ref }}"
